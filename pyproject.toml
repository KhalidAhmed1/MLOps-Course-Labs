[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mlops-course-labs"
version = "0.1.0"
description = "MLOps course labs — bank churn prediction API and training"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mlflow==2.22.0",
    "cloudpickle==3.1.1",
    "numpy==2.2.5",
    "pandas==2.2.3",
    "psutil==5.9.0",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
